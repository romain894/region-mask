name: Natural Earth regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Test and reproduce published artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository and baseline commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run unit and mask-contract tests
        run: make test PYTHON=python

      - name: Validate marimo notebooks
        run: make check-notebooks PYTHON=python

      - name: Build Sphinx documentation
        run: make docs PYTHON=python

      - name: Build and verify installed distribution
        run: make package-check PYTHON=python

      - name: Regenerate and compare Natural Earth artifacts
        run: make regression PYTHON=python

      - name: Upload regression report and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-earth-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            regression-runs/**/report.md
            regression-runs/**/metrics.json
            regression-runs/**/manifest.json
            regression-runs/**/stages.json
            regression-runs/**/figures/**
            regression-runs/**/execution/**
            regression-runs/**/sources/**
          if-no-files-found: warn
          retention-days: 30
