[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "region-mask"
version = "0.1.0"
description = "Fractional region masks and Natural Earth country/ocean preparation for research"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE-code.txt"]
authors = [
    {name = "Romain Thomas"},
    {name = "Giulia Cigna"},
    {name = "Elena De Petrillo"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "shapely>=2.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "h5netcdf>=1.3",
    "pandas>=2.2",
    "dask[distributed]>=2024.1",
    "bokeh>=3.1",
    "python-dotenv>=1",
    "geopandas>=1.0",
    "rasterio>=1.3",
    "chardet>=5",
    "pycountry>=24.6",
    "pyproj>=3.4",
]

[project.optional-dependencies]
notebooks = ["marimo>=0.24,<0.25"]
docs = ["sphinx>=8,<10"]
legacy = ["jupyterlab>=4", "nbclient>=0.10", "nbformat>=5", "ipykernel>=6", "numba"]
dev = ["region-mask[notebooks,docs,legacy]", "build>=1.2"]

[project.scripts]
region-mask = "region_mask.__main__:main"

[project.urls]
Repository = "https://github.com/romain894/region-mask"
Issues = "https://github.com/romain894/region-mask/issues"
"Research archive" = "https://doi.org/10.5281/zenodo.19007672"

[tool.setuptools.packages.find]
include = ["region_mask", "region_mask.*"]
namespaces = false

[tool.setuptools]
include-package-data = false
